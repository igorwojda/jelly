#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Jelly
# Backend API base URL baked into the app. Default is the host machine as seen from the Android emulator.
# Override per machine in local.properties (e.g. a physical device: host LAN IP), or with -Pjelly.backendBaseUrl=...
jelly.backendBaseUrl=http://10.0.2.2:8080/api/v1/

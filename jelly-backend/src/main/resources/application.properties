spring.application.name=jellybackend
# Lets local runs (IDE, bootRun) read TMDB_API_TOKEN from the same .env file Docker Compose uses
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/jelly}
spring.datasource.username=${DB_USERNAME:jelly}
spring.datasource.password=${DB_PASSWORD:jelly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

tmdb.api-token=${TMDB_API_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p

springdoc.swagger-ui.path=/swagger-ui.html
